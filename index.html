<html lang="bn">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ============================================================
   ব্র্যান্ড কালার ও লাইট/ডার্ক থিম ভ্যারিয়েবল
   ============================================================ */
:root {
  --brand:      #D3181C;   
  --brand-dark: #9e1013;   
  --black:      #111111;   
  --bg:         #f4f6f9;   
  --card:       #ffffff;
  --text:       #2d3748;
  --muted:      #718096;
  --line:       #e2e8f0;
  --radius:     16px;
  --shadow:     0 4px 15px rgba(0,0,0,0.05);
  --shadow-hover: 0 8px 25px rgba(211,24,28,0.15);
  --nav-bg:     rgba(244, 246, 249, 0.85);
}

/* ডার্ক থিম কালার */
[data-theme="dark"] {
  --brand:      #ef4444;   
  --brand-dark: #b91c1c;
  --black:      #f8fafc;   
  --bg:         #0f172a;   
  --card:       #1e293b;   
  --text:       #f1f5f9;
  --muted:      #94a3b8;
  --line:       #334155;
  --shadow:     0 4px 15px rgba(0,0,0,0.4);
  --shadow-hover: 0 8px 25px rgba(239,68,68,0.2);
  --nav-bg:     rgba(15, 23, 42, 0.85);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Hind Siliguri', system-ui, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  padding-bottom: 80px;
  transition: background 0.4s ease, color 0.4s ease;
}
img { display: block; max-width: 100%; }

/* ============================================================
   ১) হেডার স্লাইডশো
   ============================================================ */
.hero-section {
  position: relative;
  width: 100%;
  height: 250px; 
  background: #000;
  overflow: hidden;
}
@media (min-width: 768px) { .hero-section { height: 400px; } }
.slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}
.slide.active { opacity: 1; }
.hero-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
}

/* ============================================================
   ২) লোগো এবং ব্র্যান্ড নাম (ওভারল্যাপ)
   ============================================================ */
.brand-container {
  position: relative;
  z-index: 10;
  text-align: center;
  margin-top: -55px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.logo {
  height: 110px; width: 110px;
  border-radius: 50%; background: #fff; padding: 4px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  object-fit: contain;
}
.logo-fallback {
  height: 110px; width: 110px;
  border-radius: 50%; background: #fff; padding: 4px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  display: grid; place-items: center;
  font-size: 32px; font-weight: 800; color: var(--brand);
}
.brand-text {
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
  color: #fff;
  padding: 12px 45px;
  border-radius: 50px;
  margin-top: -20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  border: 2px solid #fff;
}
.brand-text h1 { font-size: 22px; font-weight: 700; }
.brand-text p { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.9; margin-top: 2px; }

/* ============================================================
   ৩) সার্চ বার এবং থিম টগল
   ============================================================ */
.search-container {
  padding: 15px 20px;
  margin-top: 15px;
  position: relative;
  z-index: 10;
  max-width: 650px;
  margin-left: auto;
  margin-right: auto;
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-box {
  flex: 1;
  display: flex; align-items: center;
  background: var(--card); border-radius: 999px;
  padding: 10px 20px; box-shadow: var(--shadow);
  border: 1px solid var(--line);
  transition: all 0.3s;
}
.search-box:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(211,24,28,0.2);
}
.search-box svg { width: 20px; height: 20px; fill: var(--muted); margin-right: 10px; }
.search-box input {
  border: none; outline: none; width: 100%;
  font-family: inherit; font-size: 15px; color: var(--text);
  background: transparent;
}
.search-box input::placeholder { color: var(--muted); }

/* থিম টগল বাটন */
.theme-toggle {
  background: var(--card); border: 1px solid var(--line);
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  box-shadow: var(--shadow); color: var(--text);
  transition: all 0.3s;
}
.theme-toggle:hover { transform: scale(1.05); }
.theme-toggle svg { width: 22px; height: 22px; fill: currentColor; }

/* ============================================================
   ৪) ক্যাটাগরি ট্যাব (Glassmorphism)
   ============================================================ */
nav {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: 10px; overflow-x: auto;
  padding: 12px 20px;
  background: var(--nav-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
  max-width: 650px;
  margin: 0 auto;
  transition: background 0.4s ease;
}
nav::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  padding: 8px 20px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card);
  color: var(--muted); font-size: 14.5px; font-family: inherit;
  white-space: nowrap; cursor: pointer; font-weight: 600;
  transition: all 0.3s;
}
.tab:hover { color: var(--text); border-color: var(--muted); }
.tab.active {
  background: var(--brand); color: #fff; border-color: var(--brand);
  box-shadow: 0 4px 12px rgba(211,24,28,0.4);
  transform: translateY(-2px);
}

/* ============================================================
   ৫) মেনু কার্ড
   ============================================================ */
main {
  padding: 15px 20px; display: flex; flex-direction: column; gap: 15px;
  max-width: 650px; margin: 0 auto;
}
.item {
  display: flex; gap: 15px; align-items: center;
  background: var(--card); border-radius: var(--radius);
  padding: 12px; box-shadow: var(--shadow);
  border: 1px solid var(--line);
  transition: transform 0.2s, box-shadow 0.2s, background 0.4s;
  animation: slideUp 0.4s ease-out forwards;
  opacity: 0; transform: translateY(10px);
}
@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
.item:hover { 
  box-shadow: var(--shadow-hover); 
  transform: translateY(-3px); 
  border-color: var(--brand);
}

.item-img {
  width: 100px; height: 100px; flex: 0 0 100px;
  border-radius: 12px; object-fit: cover; background: var(--bg);
}
.item-placeholder {
  width: 100px; height: 100px; flex: 0 0 100px;
  border-radius: 12px; background: var(--bg);
  border: 2px dashed var(--line);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--muted); font-size: 10px; text-align: center;
  transition: all 0.4s;
}
.item-placeholder span { font-size: 28px; margin-bottom: 4px; }

.item-info { flex: 1; min-width: 0; }
.item-info h2 { 
  font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3; 
  transition: color 0.4s;
}
.price-tag {
  display: inline-block; margin-top: 8px;
  background: rgba(211, 24, 28, 0.1);
  color: var(--brand); padding: 4px 12px;
  border-radius: 8px; font-weight: 700; font-size: 15px;
  transition: all 0.4s;
}
[data-theme="dark"] .price-tag {
  background: rgba(239, 68, 68, 0.15);
  text-shadow: 0 0 8px rgba(239,68,68,0.4);
}

/* ============================================================
   ৬) ফ্লোটিং হোয়াটসঅ্যাপ বাটন
   ============================================================ */
.fab-whatsapp {
  position: fixed; bottom: 25px; right: 25px;
  width: 60px; height: 60px;
  background: #25D366; color: #fff;
  border-radius: 50%; display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
  z-index: 50; transition: transform 0.2s;
  text-decoration: none;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
  70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
  100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
}
.fab-whatsapp:active { transform: scale(0.9); }
.fab-whatsapp svg { width: 32px; height: 32px; fill: currentColor; }

/* ============================================================
   ৭) ফুটার
   ============================================================ */
footer {
  margin-top: 30px; padding: 30px 20px 50px;
  text-align: center; background: var(--black); color: var(--bg);
  border-radius: 30px 30px 0 0;
  transition: all 0.4s;
}
[data-theme="dark"] footer { background: #020617; color: var(--muted); }
footer .wifi { font-size: 14px; margin-bottom: 8px; }
footer .addr { font-size: 13px; line-height: 1.6; margin-bottom: 15px; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
</style>

let currentTheme = localStorage.getItem('kgn-theme') || 'light';
document.documentElement.setAttribute('data-theme', currentTheme);
updateThemeIcon(currentTheme);

function toggleTheme() {
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', currentTheme);
  localStorage.setItem('kgn-theme', currentTheme);
  updateThemeIcon(currentTheme);
}
function updateThemeIcon(theme) {
  themeIcon.innerHTML = theme === 'dark' ? `<path d="${sunPath}"/>` : `<path d="${moonPath}"/>`;
}

/* ============================================================
   ২) স্লাইডশো লজিক
   ============================================================ */
let slideIndex = 0;
const slides = document.querySelectorAll('.slide');
function showSlides() {
  slides.forEach(slide => slide.classList.remove('active'));
  slideIndex++;
  if (slideIndex >= slides.length) { slideIndex = 0; }
  slides[slideIndex].classList.add('active');
}
setInterval(showSlides, 4000);

/* ============================================================
   ৪) স্মার্ট সার্চ এবং ট্যাব লজিক
   ============================================================ */
const $ = id => document.getElementById(id);
let currentCategory = MENU[0];

const tabsEl = $("tabs");
MENU.forEach((cat, i) => {
  const b = document.createElement("button");
  b.className = "tab" + (i === 0 ? " active" : "");
  b.textContent = cat.category;
  b.onclick = () => {
    $("searchInput").value = ""; 
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    b.classList.add("active");
    currentCategory = cat;
    renderMenu(cat.items);
    b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  };
  tabsEl.appendChild(b);
});

function renderMenu(items) {
  const menu = $("menu");
  menu.innerHTML = "";
  
  if (items.length === 0) {
    menu.innerHTML = `<div class="empty-state"><h3>কোনো খাবার পাওয়া যায়নি!</h3><p>অন্য কিছু লিখে সার্চ করুন।</p></div>`;
    return;
  }

  items.forEach((item, index) => {
    const card = document.createElement("article");
    card.className = "item";
    card.style.animationDelay = `${index * 0.05}s`;
    
    let imgHTML = item.image 
      ? `<img class="item-img" src="${item.image}" alt="${item.name}" loading="lazy" />`
      : `<div class="item-placeholder"><span>🍽️</span>ছবি যুক্ত করুন</div>`;

    card.innerHTML = `
      ${imgHTML}
      <div class="item-info">
        <h2>${item.name}</h2>
        <span class="price-tag">৳ ${item.price}</span>
      </div>
    `;
    menu.appendChild(card);
  });
}

function handleSearch() {
  const query = $("searchInput").value.toLowerCase().trim();
  
  if (query === "") {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tabsEl.children[currentCategory ? MENU.indexOf(currentCategory) : 0].classList.add("active");
    renderMenu(currentCategory.items);
    return;
  }

  const allItems = MENU.flatMap(cat => cat.items);
  const filtered = allItems.filter(item => item.name.toLowerCase().includes(query));
  
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  renderMenu(filtered);
}

renderMenu(MENU[0].items);
